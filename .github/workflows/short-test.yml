# Pilotes des Shorts extraits v3 « Le quiz express » : rend les 3 Shorts d'un épisode (voix réelle) sans rien mettre en ligne.
name: Shorts v3 (pilotes)
on:
  workflow_dispatch:
    inputs:
      episodes:
        description: "Identifiants d'épisodes séparés par des espaces (ex. 2026-11-12-pays-sans-voyelles)"
        required: false
        type: string
      cleanup:
        description: "Supprimer une pré-release de test et son étiquette (ex. test-finitions-v3) — rien d'autre n'est exécuté"
        required: false
        type: string
      pilot:
        description: "Pilotes des finitions v3 (vidéo longue) : épisode à rendre, ex. pilote-finitions — remplace alors les Shorts"
        required: false
        type: string
      only:
        description: "Ne rendre qu'un des 3 Shorts de chaque épisode (1, 2 ou 3 ; vide = les 3)"
        required: false
        type: string
concurrency:
  group: short-test
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Ménage d'une pré-release de test
        if: ${{ inputs.cleanup != '' && startsWith(inputs.cleanup, 'test-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ inputs.cleanup }}" -y --cleanup-tag -R "${{ github.repository }}"
      - uses: actions/checkout@v4
        if: ${{ inputs.cleanup == '' }}
      - uses: actions/setup-node@v4
        if: ${{ inputs.cleanup == '' }}
        with:
          node-version: 22
          cache: npm
      - name: Dépendances (+ ffmpeg)
        if: ${{ inputs.cleanup == '' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm ci
          npx remotion browser ensure
      - name: Pilotes finitions v3 (voix réelle horodatée + 3 rendus B, C, D)
        if: ${{ inputs.pilot != '' && inputs.cleanup == '' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          MUSIC_URL: ${{ secrets.MUSIC_URL }}
          REMOTION_CONCURRENCY: 2
          TTS_VERBOSE: 1
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/get-music.mjs && node scripts/prepare-assets.mjs
          node scripts/tts.mjs --episode "data/pilots/${{ inputs.pilot }}.json"
          node -e 'const e=require("./data/pilots/${{ inputs.pilot }}.json");const c=e.items[0].voice?.q;console.log("voix :",e.voice?Object.keys(e.voice).length:0,"lignes ; Q1 :",JSON.stringify(c))'
          node scripts/pilot.mjs --episode "data/pilots/${{ inputs.pilot }}.json" --only V2
          gh release delete test-finitions-v3 -y --cleanup-tag 2>/dev/null || true
          gh release create test-finitions-v3 out/pilote/*.mp4 --target "${{ github.sha }}" --title "TEST finitions v3" --notes "Extraits pilotes des finitions v3 (lots B, C, D), rien n'est publié. À supprimer après contrôle." --prerelease --latest=false
      - name: Sons
        if: ${{ inputs.pilot == '' && inputs.cleanup == '' }}
        env:
          MUSIC_URL: ""
        run: |
          node scripts/prepare-assets.mjs
          [ -f public/audio/crackle.mp3 ] || ffmpeg -y -nostdin -loglevel error -f lavfi -i "anoisesrc=c=pink:a=0.05:d=20" -af "highpass=f=1200,lowpass=f=4500,volume=0.35" -b:a 96k public/audio/crackle.mp3
          node -e 'const f="src/audio.json",m=JSON.parse(require("fs").readFileSync(f));m.crackle=true;require("fs").writeFileSync(f,JSON.stringify(m,null,2)+"\n")'
      - name: Voix + rendu
        if: ${{ inputs.pilot == '' && inputs.cleanup == '' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          REMOTION_CONCURRENCY: 2
        run: |
          for id in ${{ inputs.episodes }}; do node scripts/short-v3.mjs --episode "data/episodes/$id.json" ${{ inputs.only != '' && format('--only {0}', inputs.only) || '' }}; done
      - name: Pré-release de contrôle
        if: ${{ inputs.pilot == '' && inputs.cleanup == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-short-v3 -y --cleanup-tag 2>/dev/null || true
          gh release create test-short-v3 out/short-v3/*.mp4 --title "TEST Shorts v3" --notes "Pilotes des Shorts extraits v3 (${{ inputs.episodes }}), rien n'est publié. À supprimer après contrôle." --prerelease --latest=false
