name: Musiques candidates (Eleven Music)

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Piliers à générer, séparés par des virgules (vide = tous : devine, choix, culture, generations, emojis)"
        required: false
      seconds:
        description: "Durée de chaque piste en secondes"
        required: false
        default: "120"

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Générer les pistes
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          ARGS=""
          [ -n "${{ inputs.only }}" ] && ARGS="$ARGS --only ${{ inputs.only }}"
          [ -n "${{ inputs.seconds }}" ] && ARGS="$ARGS --seconds ${{ inputs.seconds }}"
          node scripts/eleven-music.mjs $ARGS
      # Dépôt public : pas d'artefact (il serait téléchargeable par tous). Les pistes candidates restent sur l'exécuteur ;
      # pour les écouter, lancer scripts/eleven-music.mjs en local.
